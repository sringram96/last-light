 let current=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,g=chars[i];if(g===' ')continue;if(ink[i]!==current){current=ink[i];ctx.fillStyle=colors[current];}ctx.fillText(g,x*cw,y*ch);}
}
function ui(){mono.textContent=state.mono?'[COLOR]':'[MONO]';mono.setAttribute('aria-pressed',String(state.mono));pause.textContent=state.paused?'[PLAY]':'[PAUSE]';pause.setAttribute('aria-pressed',String(state.paused));walk.textContent=state.moving?'[STOP HERE]':state.travel>.985?'[WALK BACK]':'[FOLLOW THE LANTERN]';}
function pose(){camera.z=mix(-5,15,state.travel);camera.x=mix(-.8,-2.6,smooth(state.travel));camera.y=2.05+(state.moving&&!reduce?Math.sin(state.t*6)*.025:0);camera.yaw=.035+state.look;camera.pitch=.085;}
function resize(){const width=canvas.clientWidth;if(width<=0)return;W=clamp(Math.floor(width/4.2),72,180);H=Math.round(W*(width<480?.67:.39));cw=width/W;ch=cw*1.72;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(H*ch*dpr);canvas.style.height=H*ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);fx=W/(2*Math.tan((width<480?66:78)*Math.PI/360));fy=fx/1.72;zbuf=new Float32Array(W*H);chars=new Array(W*H);ink=new Uint16Array(W*H);render();}
function lookAt(delta){state.lookTarget=clamp(state.lookTarget+delta,-.85,.85);if(reduce||state.paused){state.look=state.lookTarget;pose();render();}}
left.addEventListener('click',()=>lookAt(-.34));right.addEventListener('click',()=>lookAt(.34));
walk.addEventListener('click',()=>{
 if(state.moving){state.moving=false;ui();return;}state.target=state.travel>.985?0:1;state.lookTarget=0;
 if(reduce){state.travel=state.target;state.look=0;pose();render();caption.textContent=state.travel?'He stops beneath the station clock. The upper windows are still lit.':'The last tram has gone. Someone is still carrying a lantern toward the station.';}
 else{state.moving=true;state.paused=false;caption.textContent=state.target?'You follow at a distance. Windows and doorways slide past.':'You retrace the route toward the boarding house.';}ui();
});

function tick(now){if(!root.isConnected)return;const dt=Math.min(.1,(now-lastTime)/1000||0);lastTime=now;if(!state.paused&&visible&&!document.hidden){state.t+=dt;state.look+=clamp(state.lookTarget-state.look,-dt*.8,dt*.8);if(state.moving){const delta=state.target-state.travel;state.travel+=Math.sign(delta)*Math.min(Math.abs(delta),dt*.065);if(Math.abs(state.target-state.travel)<.0001){state.moving=false;caption.textContent=state.travel?'He stops beneath the station clock. The upper windows are still lit.':'You are back at the boarding house. The station remains in sight.';place.textContent=state.travel?'NORTH STATION / MIDNIGHT':'STATION ROAD / MIDNIGHT';ui();}}if(now-lastFrame>66){pose();render();lastFrame=now;}}requestAnimationFrame(tick);}
ui();pose();resize();requestAnimationFrame(tick);
