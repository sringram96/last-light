<div id="last-light-cinema" aria-label="The Last Light: a cinematic ASCII detective game">
<style>
#last-light-cinema{color-scheme:dark;background:#03070b;color:#dce1da;padding:14px;box-sizing:border-box;width:100%;font:12px/1.6 ui-monospace,Consolas,"Liberation Mono",monospace}
#last-light-cinema *{box-sizing:border-box}
#last-light-cinema .lc-top,#last-light-cinema .lc-status,#last-light-cinema .lc-actions,#last-light-cinema .lc-options{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 18px}
#last-light-cinema .lc-top{padding:2px 2px 10px;color:#d8ba87;letter-spacing:2px}
#last-light-cinema .lc-small{font-size:11px;color:#99abb5;letter-spacing:0}
#last-light-cinema canvas{display:block;width:100%;background:#03070b;touch-action:pan-y}
#last-light-cinema button{font:inherit;background:transparent;border:0;border-radius:0;color:#dbe0d6;min-height:44px;padding:8px 0;text-align:left}
#last-light-cinema button:hover,#last-light-cinema button:focus-visible{color:#ffd391}
#last-light-cinema button[aria-pressed="true"]{color:#efc789}
#last-light-cinema button:disabled{color:#829097}
#last-light-cinema .lc-actions{justify-content:flex-start;gap:0 22px;min-height:44px}
#last-light-cinema .lc-status{padding-top:10px;color:#efc789;font-size:11px}
#last-light-cinema .lc-timer{font-variant-numeric:tabular-nums;white-space:nowrap}
#last-light-cinema .lc-caption{min-height:40px;margin:6px 0;color:#d1dcde;max-width:65em}
#last-light-cinema .lc-options{justify-content:flex-end;gap:0 18px;font-size:11px}
#last-light-cinema .lc-options button{color:#99abb5}
#last-light-cinema .lc-journal summary{min-height:44px;padding:10px 0;color:#d8ba87;font-size:11px}
#last-light-cinema .lc-reel summary{min-height:44px;padding:10px 0;color:#99abb5;font-size:11px}
#last-light-cinema .lc-reel-actions{display:flex;flex-wrap:wrap;gap:0 22px}
#last-light-cinema .lc-clues{padding:0;list-style:none;margin:0 0 8px;color:#b4c6cc}
#last-light-cinema .lc-clues li{padding:5px 0;max-width:65em}
#last-light-cinema .lc-outcome{margin:8px 0;color:#d8ba87}
#last-light-cinema [hidden]{display:none!important}
@media(max-width:440px){#last-light-cinema{padding:10px;font-size:11px}#last-light-cinema .lc-top{letter-spacing:1px}#last-light-cinema .lc-actions{gap:0 16px}}
</style>
<div class="lc-top"><span>THE LAST LIGHT</span><span class="lc-small lc-chapter">01 / STATION ROAD</span></div>
<canvas role="img" aria-label="A dense three-dimensional night street rendered entirely in ASCII, with moving camera, warm lamps, wet tram tracks, trees, and the station clock tower."></canvas>
<div class="lc-status"><span class="lc-phase"></span><span class="lc-timer" aria-hidden="true"></span></div>
<p class="lc-caption" aria-live="polite"></p>
<p class="lc-outcome" hidden></p>
<div class="lc-actions" role="group" aria-label="Story choices"></div>
<div class="lc-options"><button type="button" class="lc-menu cursor-interaction">[MENU]</button><button type="button" class="lc-timing cursor-interaction" aria-pressed="false">[TIMED]</button><button type="button" class="lc-mono cursor-interaction" aria-pressed="false">[MONO]</button><button type="button" class="lc-pause cursor-interaction" aria-pressed="false">[PAUSE]</button></div>
<details class="lc-journal" hidden><summary class="cursor-interaction">CASE NOTES</summary><ul class="lc-clues"></ul></details>
<details class="lc-reel"><summary class="cursor-interaction">SCENE REEL / PREVIEW LOCATIONS</summary><p class="lc-small">Explore the locations. Your story checkpoint stays saved.</p><div class="lc-reel-actions" role="group" aria-label="Start a preview route at a location"></div></details>
<!-- CINEMA_SCRIPT -->
</div>
